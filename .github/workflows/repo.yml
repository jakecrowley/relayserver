name: Build and publish Sileo repo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git perl curl rsync zstd \
            xz-utils zip binutils python3 python3-pip

      - name: Restore Theos toolchain cache
        uses: actions/cache@v4
        id: theos
        with:
          path: ~/theos
          key: theos-swift-toolchain-v2.3.0-iPhoneOS16.5

      - name: Install Theos + cross-toolchain + SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz \
            -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain/"
          TMP_SDK="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_SDK"
          cp -r "$TMP_SDK/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          rm -rf "$TMP_SDK"

      - name: Shared-library symlinks for the toolchain bundle
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"
          for LIB_DIR in "$THEOS/toolchain/linux/host/lib" "$THEOS/toolchain/linux/iphone/lib"; do
            mkdir -p "$LIB_DIR"
            [ -e /usr/lib/libedit.so.0 ]     && ln -sf /usr/lib/libedit.so.0     "$LIB_DIR/libedit.so.2" || true
            [ -e /usr/lib/libncursesw.so.6 ] && ln -sf /usr/lib/libncursesw.so.6 "$LIB_DIR/libncurses.so.6" || true
            [ -e /usr/lib/libpanelw.so.6 ]   && ln -sf /usr/lib/libpanelw.so.6   "$LIB_DIR/libpanel.so.6" || true
            [ -e /usr/lib/libformw.so.6 ]    && ln -sf /usr/lib/libformw.so.6    "$LIB_DIR/libform.so.6" || true
            [ -e /usr/lib/libmenuw.so.6 ]    && ln -sf /usr/lib/libmenuw.so.6    "$LIB_DIR/libmenu.so.6" || true
          done

      - name: Install Rust 1.98.0 with aarch64-apple-ios target
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          rustup default 1.98.0

      - name: Build both .deb variants from the tag
        run: bash scripts/build_debs.sh "${GITHUB_REF_NAME#v}"

      - name: Fetch prior pool (additive publish)
        run: |
          set -euo pipefail
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages --depth=1
            git checkout FETCH_HEAD -- pool/main
            cp pool/main/*.deb relay-package/packages/
            rm -rf pool
          else
            echo "no existing gh-pages pool; starting fresh"
          fi

      - name: Import signing key (fail loud if secret missing)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons --fingerprint

      - name: Generate + sign repo metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_ID=$(gpg --list-secret-keys --with-colons --fingerprint | awk -F: '/^fpr:/{print $10; exit}')
          python3 repo/build_repo.py \
            --packages-dir relay-package/packages \
            --out-dir out \
            --require-sign \
            --gpg-key "$KEY_ID" \
            --origin relayserver --label relayserver \
            --suite stable --codename stable \
            --passphrase "$GPG_PASSPHRASE"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          commit_message: "publish repo ${GITHUB_REF_NAME}"
